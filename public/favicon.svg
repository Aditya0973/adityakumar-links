<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background with brutalist styling -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#FD601A" stroke="#1E1E1E" stroke-width="8"/>
  <!-- Drop shadow layer -->
  <g transform="translate(4, 4)">
    <rect x="52" y="16" width="24" height="88" rx="4" fill="#1E1E1E"/>
    <rect x="24" y="37" width="24" height="88" rx="4" transform="rotate(-45 24 37)" fill="#1E1E1E"/>
    <rect x="20" y="72" width="24" height="88" rx="4" transform="rotate(-90 20 72)" fill="#1E1E1E"/>
    <rect x="41" y="100" width="24" height="88" rx="4" transform="rotate(-135 41 100)" fill="#1E1E1E"/>
  </g>
  <!-- Foreground Asterisk Starburst (from Group 1.svg) in Crisp White -->
  <g transform="translate(0, 0)">
    <rect x="52" y="16" width="24" height="88" rx="4" fill="#FFFFFF"/>
    <rect x="24" y="37" width="24" height="88" rx="4" transform="rotate(-45 24 37)" fill="#FFFFFF"/>
    <rect x="20" y="72" width="24" height="88" rx="4" transform="rotate(-90 20 72)" fill="#FFFFFF"/>
    <rect x="41" y="100" width="24" height="88" rx="4" transform="rotate(-135 41 100)" fill="#FFFFFF"/>
  </g>
</svg>